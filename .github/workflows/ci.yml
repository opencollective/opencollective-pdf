name: CI

# Security: Do not replace `pull_request` with `pull_request_target` to expose secrets or
# GITHUB_TOKEN write access to PR code. pull_request_target runs untrusted fork PR code with
# base-branch privileges.

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  id-token: write

env:
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_AGENT_GUIDANCE: 'false'
  # Repository branch pushes and same-repository PRs share the remote cache.
  # Fork PRs, tag pushes, and runs without TURBO_TEAM stay local.
  TURBO_CACHE: >-
    ${{ vars.TURBO_TEAM != '' &&
        ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) ||
         (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) &&
        'local:rw,remote:rw' || 'local:rw' }}
  OC_ENV: ci

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Set up Turborepo Remote Cache
        if: ${{ env.TURBO_CACHE == 'local:rw,remote:rw' && env.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ env.TURBO_TEAM }}
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Install dependencies
        run: CYPRESS_INSTALL_BINARY=0 npm ci --prefer-offline --no-audit
      - run: npm run lint

  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Set up Turborepo Remote Cache
        if: ${{ env.TURBO_CACHE == 'local:rw,remote:rw' && env.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ env.TURBO_TEAM }}
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - run: npm run prettier:check

  typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Set up Turborepo Remote Cache
        if: ${{ env.TURBO_CACHE == 'local:rw,remote:rw' && env.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ env.TURBO_TEAM }}
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Install dependencies
        run: CYPRESS_INSTALL_BINARY=0 npm ci --prefer-offline --no-audit
      - run: npm run type:check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Set up Turborepo Remote Cache
        if: ${{ env.TURBO_CACHE == 'local:rw,remote:rw' && env.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ env.TURBO_TEAM }}
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - run: npm run test:coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload snapshots on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: snapshots-${{ github.run_id }}-${{ strategy.job-index }}
          path: test/__snapshots__
        if: ${{ failure() }}

  check-tax-forms-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - run: npm run script scripts/check-tax-forms-config.ts

  depcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - name: Set up Turborepo Remote Cache
        if: ${{ env.TURBO_CACHE == 'local:rw,remote:rw' && env.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ env.TURBO_TEAM }}
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - run: npm run depcheck
